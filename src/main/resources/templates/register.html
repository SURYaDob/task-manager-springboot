<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Task Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            height: 100vh;
        }
        .left-panel {
            background: linear-gradient(135deg, #1A5276, #2980b9);
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            color: white;
        }
        .left-panel .icon { font-size: 70px; margin-bottom: 24px; }
        .left-panel h2 { font-size: 32px; margin-bottom: 12px; }
        .left-panel p { font-size: 16px; opacity: 0.8; text-align: center; line-height: 1.6; }
        .steps { margin-top: 32px; display: flex; flex-direction: column; gap: 14px; }
        .step { display: flex; align-items: center; gap: 12px; font-size: 15px; }
        .step-num {
            background: rgba(255,255,255,0.2);
            width: 30px; height: 30px;
            border-radius: 50%;
            display: flex; align-items: center;
            justify-content: center;
            font-weight: bold; font-size: 14px;
        }
        .right-panel {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f0f2f5;
            padding: 40px;
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 { color: #1A5276; margin-bottom: 8px; font-size: 26px; }
        p.subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #333; font-weight: bold; }
        input {
            width: 100%; padding: 11px 14px;
            border: 1.5px solid #ddd; border-radius: 8px;
            font-size: 14px; outline: none;
        }
        input:focus { border-color: #2980b9; }
        button {
            width: 100%; padding: 12px;
            background: linear-gradient(135deg, #1A5276, #2980b9);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; cursor: pointer; margin-top: 8px;
        }
        button:hover { opacity: 0.9; }
        .error {
            background: #fdecea; color: #c0392b;
            padding: 10px; border-radius: 8px;
            margin-bottom: 16px; font-size: 14px;
        }
        .link { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .link a { color: #1A5276; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="left-panel">
        <div class="icon">🚀</div>
        <h2>Get Started!</h2>
        <p>Create your free account and start<br>managing your tasks today.</p>
        <div class="steps">
            <div class="step">
                <div class="step-num">1</div>
                Create your account
            </div>
            <div class="step">
                <div class="step-num">2</div>
                Add your first task
            </div>
            <div class="step">
                <div class="step-num">3</div>
                Track your progress
            </div>
            <div class="step">
                <div class="step-num">4</div>
                Achieve your goals 🎯
            </div>
        </div>
    </div>

    <div class="right-panel">
        <div class="card">
            <h2>Create Account</h2>
            <p class="subtitle">Register to start managing your tasks</p>

            <div class="error" th:if="${error}" th:text="${error}"></div>

            <form method="post" action="/register">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="fullName" placeholder="Enter your full name" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="email" placeholder="Enter your email" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" placeholder="Create a password" required />
                </div>
                <button type="submit">Create Account</button>
            </form>

            <div class="link">
                Already have an account? <a href="/login">Login here</a>
            </div>
        </div>
    </div>
</body>
</html>
